<!doctype html><meta charset="utf-8"><title>Underwater preview</title>
<style>body{margin:0;background:#123;color:#fff;font:14px sans-serif}canvas{width:100vw;height:100vh;display:block}aside{position:fixed;left:16px;top:16px;max-width:540px;padding:16px;background:#123e}button,select{font:inherit;padding:9px;margin:4px}p{margin:8px 4px}</style>
<canvas></canvas><aside><strong>Incoming beach foam and underwater scenery</strong><p>Broken foam fronts travel toward sandy shores, alongside narrow shoreline wash and crest whitecaps. Sand, seagrass and caustics show through transparent water. Freeze and step time to inspect the incoming bands.</p>
<button id="freeze">Freeze</button><button id="step">Step 0.5 seconds</button><select id="camera"><option>Beach</option><option>Channel</option><option>Seagrass</option></select>
<select id="light"><option>day</option><option>sunset</option><option>night</option></select><p id="status"></p></aside>
<script type="module">
import {Renderer,TITLE_CAMERA} from '../src/renderer.js';
import {createRace} from '../src/simulation.js';
const renderer=new Renderer(document.querySelector('canvas')),race=createRace('main');
race.phase='title';race.worldTime=12;race.lightingCourse={...race.course,lighting:'day'};
let frozen=false,last=0;
const views=[[[0,18,140],[0,0,92]],[[183,13,5],[153,-3,5]],[[-105,13,-100],[-105,-5,-112]]];
function camera(){const [eye,target]=views[document.querySelector('#camera').selectedIndex];TITLE_CAMERA.eye=eye;TITLE_CAMERA.target=target;Object.assign(race.racers[0],{x:target[0],z:target[2]});}
camera();document.querySelector('#camera').onchange=camera;
document.querySelector('#freeze').onclick=e=>{frozen=!frozen;e.target.textContent=frozen?'Resume':'Freeze';};
document.querySelector('#step').onclick=()=>{frozen=true;document.querySelector('#freeze').textContent='Resume';race.worldTime+=.5;};
document.querySelector('#light').onchange=e=>{race.lightingCourse={...race.course,lighting:e.target.value};renderer.lightingReady=false;};
function frame(now){const dt=Math.min((now-last)/1000||0,1/30);last=now;if(!frozen)race.worldTime+=dt;renderer.draw(race,dt);
 document.querySelector('#status').textContent=`${document.querySelector('#camera').value} · ${document.querySelector('#light').value} · time ${race.worldTime.toFixed(2)} · WebGL ${renderer.gl.getError()===0&&!renderer.gl.isContextLost()?'OK':'ERROR'}`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
