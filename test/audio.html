<!doctype html><html lang="en"><meta charset="utf-8"><title>Sunwake Rush sound effects</title>
<style>body{background:#183b3a;color:#f4f6df;font:18px Arial;padding:40px}button{padding:16px;margin:8px;background:#c7ff75;border:0;cursor:pointer}</style>
<h1>Sound effects</h1><button id="pass">Correct buoy</button><button id="miss">Missed buoy</button><button id="max">Reach maximum level</button><p id="status">Choose a cue to enable audio.</p>
<script type="module">
import { RaceAudio } from '../src/audio.js';
const sound=new RaceAudio(),status=document.getElementById('status');let analyser,samples,peak=0;
for(const speed of [0,45,80]){
 const button=document.createElement('button');button.textContent=`Player engine ${speed}`;status.before(button);
 button.onclick=async()=>{await cue('engine');sound.update({phase:'racing',racers:[{speed}]});sound.waterGain.gain.cancelScheduledValues(sound.context.currentTime);sound.waterGain.gain.value=0;};
}
for(const speed of [0,45,80]){
 const button=document.createElement('button');button.textContent=`Water rush ${speed}`;status.before(button);
 button.onclick=async()=>{await cue('water');sound.update({phase:'racing',racers:[{speed}]});sound.engineGain.gain.cancelScheduledValues(sound.context.currentTime);sound.engineGain.gain.value=0;};
}
for(const [type,label,strength] of [['beep','Countdown'],['go','Go'],['splash','Splash'],['lap','Lap'],['finish','Finish'],['lose','Lose'],['impact','Impact']]){
 const button=document.createElement('button');button.textContent=label;status.before(button);
 button.onclick=()=>cue(type,strength);
}
async function cue(type,strength){
 await sound.unlock();
 sound.update({phase:'paused',racers:[{speed:0}]});
 if(!analyser){analyser=sound.context.createAnalyser();analyser.fftSize=2048;sound.master.connect(analyser);samples=new Float32Array(analyser.fftSize);}
 peak=0;sound.event({type:type==='max'?'speedLevel':type,id:0,level:5,strength});
 if(type==='max')sound.event({type:'gate',id:0});
}
document.getElementById('pass').onclick=()=>cue('gate');
document.getElementById('miss').onclick=()=>cue('miss');
document.getElementById('max').onclick=()=>cue('max');
function frame(){
 if(analyser){analyser.getFloatTimeDomainData(samples);for(const sample of samples)peak=Math.max(peak,Math.abs(sample));status.textContent=`Audio ${sound.context.state} · Output peak ${peak.toFixed(3)}`;}
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
