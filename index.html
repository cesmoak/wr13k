<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eaf0d8">
  <meta name="description" content="Three sunlit islands. An open throttle. A completely procedural jet-ski racer.">
  <title>Sunwake Rush — Ride the spectrum</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c7ff75'/%3E%3Cpath d='M5 18q5-9 10 0t12 0M5 24q5-9 10 0t12 0' fill='none' stroke='%23243f3e' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Sunwake Rush 3D racing course"></canvas>
  <div id="vignette"></div>
  <main id="title-screen" class="title-screen">
    <div class="hero-copy">
      <h1>SUNWAKE<br><span>RUSH</span></h1>
      <div class="course-menu" role="group" aria-label="Choose your ride">
        <button type="button" data-course="free" aria-pressed="false"><b>Free play</b></button>
        <button type="button" data-course="main" aria-pressed="true"><b>Main island loop</b></button>
        <button type="button" data-course="reverse" aria-pressed="false"><b>Main island reverse</b></button>
        <button type="button" data-course="rocky" aria-pressed="false"><b>Rocky island loop</b></button>
        <button type="button" data-course="sunrise" aria-pressed="false"><b>Sunrise reef loop</b></button>
      </div>
      <div class="start-row"><button id="start" class="primary">START</button></div>
    </div>
  </main>
  <section id="hud" hidden aria-label="Race information">
    <div class="race-top"><div class="position"><span class="small-label">POSITION</span><div><b id="position">4</b><span>/ 4</span></div></div><div class="race-stat"><span class="small-label">RACE TIME</span><b id="timer">00:00.00</b></div><button id="pause" class="pause-button" title="Pause · Escape" aria-label="Pause race">Ⅱ</button></div>
    <div class="map-panel"><div class="map-title"><span>SUNWAKE RUSH</span><span>↻</span></div><canvas id="map" width="300" height="228" aria-label="Course map and racer positions"></canvas><span id="map-caption" class="map-caption">ROCKY ISLAND CIRCUIT</span></div>
    <div class="leaderboard" id="leaderboard"></div>
    <div class="telemetry"><div id="miss-counter" role="status" aria-label="Buoy misses"><span>MISSED BUOYS</span><b id="misses">0 / 5</b></div><div id="speed-level" class="speed-level" role="status" aria-label="Speed level 1 of 5"><div class="speed-level-label"><span>SPEED LEVEL</span><b id="speed-level-value">1 / 5</b></div><div class="speed-level-bars" aria-hidden="true"><i class="active"></i><i></i><i></i><i></i><i></i></div></div><div class="speed"><b id="speed">0</b><span>KM/H</span></div></div>
    <div id="notice" role="status"></div>
    <div class="race-controls"><span><kbd>ESC</kbd> PAUSE</span><span><kbd>R</kbd> RESTART</span></div>
  </section>
  <div id="countdown" hidden><span>FIND YOUR LINE</span><b>3</b></div>
  <section id="pause-screen" class="modal-wrap" aria-label="Paused" hidden><div class="modal"><button id="resume" class="primary">RESUME</button><button id="restart-pause" class="secondary">RESTART</button><button id="course-menu" class="secondary">COURSES</button></div></section>
  <section id="results" class="modal-wrap" hidden><div class="modal results-card"><h2 id="finish-title">Nice wake.</h2><p id="finish-summary"></p><div id="result-list"></div><button id="retry" class="primary">RETRY</button><button id="back-home" class="secondary">COURSES</button></div></section>
  <section id="error" class="modal-wrap" hidden><div class="modal"><h2>A little flat water.</h2><p id="error-message"></p><button onclick="location.reload()" class="primary">TRY AGAIN <span>↗</span></button></div></section>
  <script type="module" src="src/main.js"></script>
</body>
</html>
