<!doctype html>
<head>
  <meta name="theme-color" content="#eaf0d8">
  <meta name="description" content="Three sunlit islands. An open throttle. A completely procedural jet-ski racer.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <main id="title-screen">
    <div class="hero-copy">
      <h1>SUNWAKE<br>RUSH</h1>
      <div class="course-menu"></div>
      <h2 id="finish-title" hidden></h2>
      <div id="result-list" hidden></div>
      <button id="start">START</button>
      <button id="course-menu" hidden>COURSES</button>
    </div>
  </main>
  <section id="hud" hidden>
    <p class="hud-item"><span>POSITION / 4</span><b id="position"></b></p>
    <p class="hud-item"><span>RACE TIME</span><b id="timer"></b></p>
    <p class="hud-item" id="miss-counter"><span>MISSED BUOYS</span><b id="misses"></b></p>
    <p class="hud-item"><span>SPEED LEVEL</span><b id="speed-level-value"></b></p>
    <p class="hud-item"><span>KM/H</span><b id="speed"></b></p>

  </section>
  <div id="countdown" class="hud-item" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
